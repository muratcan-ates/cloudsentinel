# Bandit configuration — `make audit` and the CI security job.
#
# The gate is real: anything not named below fails the build. What IS
# named is skipped with a reason, because a scanner that is silenced by
# tuning its severity knobs proves nothing.
#
# B608 — "possible SQL injection through string-based query construction".
#   Every dynamic fragment in this repo is a list of `?` placeholders built
#   from a Python list's length (`",".join("?" for _ in ids)`), never a
#   value and never operator input. Values are bound parameters without
#   exception; the LIKE search in app/decisions.py escapes its wildcards
#   before binding. Verified by hand across every hit.
#
# B105 — "possible hardcoded password". Every hit is an environment
#   variable NAME (SENTINEL_ADMIN_PASSWORD) or an empty-string token
#   initializer, not a secret. Real secrets are read from the environment
#   and never committed; the git history was audited for leaks separately.
#
# B311 — "standard pseudo-random generators are not suitable for
#   security purposes". The only uses are the simulated cost stream and
#   the benchmark data generator, both explicitly synthetic and both
#   labelled as such on the wire. Nothing security-bearing is randomized.
#
# B101 — "assert used". One assert in scripts/spike_gemini.py, a manual
#   provider smoke script that is never imported by the app.
skips:
  - B608
  - B105
  - B311
  - B101

exclude_dirs:
  - ./.venv
  - ./tests
  - ./node_modules
