# Render Blueprint — CloudSentinel (competition deployment, locked plan).
# Free web service; the disk is ephemeral by design: the schema rebuilds on
# every boot (seed-on-startup), and the watchdog below refills the decision
# rooms so a restart never greets a visitor with an empty desk. The service
# is kept awake by the repo's own CI keepalive workflow pinging /health —
# no third-party uptime monitor is used.
services:
  - type: web
    name: cloudsentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      # Deterministic fake provider until a GEMINI_API_KEY is configured in
      # the dashboard (billing-disabled project key; then set this to 0).
      - key: SENTINEL_FAKE_LLM
        value: "1"
      # Lights the "LIVE ON RENDER" banner on the dashboard edition line.
      - key: SENTINEL_ENV
        value: render
      # Public showcase: strangers' clicks must not mutate shared state —
      # every write answers 403 and the dashboard says so. Deliberate for
      # the jury link; drop only on a private instance.
      - key: SENTINEL_READONLY
        value: "1"
      # The standing watch. WITHOUT this the deployed instance never runs a
      # pulse, so the decision desk, the ledger and the intelligence room
      # stay empty for every visitor — the read-only guard blocks the only
      # other way to populate them. The watchdog is exempt from that guard
      # by design (the system's own heartbeat, not a stranger's write), and
      # a cold database is filled a few seconds after boot rather than one
      # interval later, so a woken free instance is never shown empty.
      - key: SENTINEL_WATCH_INTERVAL_SECONDS
        value: "1800"
      # The live-data knobs (SENTINEL_COSTS_SOURCE=self, SENTINEL_COSTS_FILE,
      # SENTINEL_*_FEED_URL) stay unset here on purpose: the public demo
      # serves the reproducible fixture; a fresh ephemeral deploy has no
      # accumulated telemetry history to show.
      # The simulated live tape: a synthetic ticker in the watch room and a
      # run-rate line under the cost hero. Read-only, in-process, no network
      # and no database writes, and every payload says simulated: true.
      # Declared here because the running service has it — a blueprint that
      # claimed otherwise would silently darken the tape on the next sync.
      - key: SENTINEL_SIM_STREAM
        value: "1"
      # Optional, deliberately left off: SENTINEL_COSTS_SOURCE=sim also puts
      # the cost lane on the tape (the estate's own history with today
      # projected live), and the data badge then reads "SIMULATED LIVE".
