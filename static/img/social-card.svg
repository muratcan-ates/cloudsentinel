<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="sc-title">
  <title id="sc-title">CloudSentinel — the machine watches, the human decides</title>
  <rect width="1200" height="630" fill="#eef3f9"/>
  <rect x="28" y="28" width="1144" height="574" rx="22" fill="#ffffff" stroke="#0e1f38" stroke-opacity=".09"/>

  <!-- brand row: the sentinel mark and the wordmark -->
  <path d="M100 128h9.75L117.25 103.25l7.5 24.75h9.75" fill="none" stroke="#1d5cff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="158" y="130" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#0e1f38">cloudsentinel<tspan fill="#1d5cff">.</tspan></text>

  <!-- the quiet series, with the one reading that broke the band -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M860 118h240" stroke="#0e1f38" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M860 142l32-8 32 6 32-8 32 6 22-42 22 44 32-6 36 4" stroke="#0e1f38" stroke-opacity=".35" stroke-width="3"/>
    <circle cx="1010" cy="96" r="9" fill="#ffffff" stroke="#1d5cff" stroke-width="3"/>
  </g>

  <!-- the thesis -->
  <text font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="600" fill="#0e1f38">
    <tspan x="100" y="308">the machine watches,</tspan>
    <tspan x="100" y="394">the human decides.</tspan>
  </text>

  <path d="M100 452h1000" stroke="#0e1f38" stroke-opacity=".12" stroke-width="2"/>
  <text x="100" y="500" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#0e1f38" fill-opacity=".66">anomaly watch · evidence-cited triage · simulated execution</text>
  <text x="100" y="556" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0e1f38" fill-opacity=".5">YZTA Bootcamp 2026 · AI Track · Team CloudSentinel (Group 60)</text>
</svg>
