# Keeps the free-tier deploy awake and honest: a scheduled /health ping
# every ~10 minutes (Render spins down on idle; the first cold request
# costs ~46s, which reads as a dead link to a jury). No external uptime
# service — the repo's own CI is the pinger.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  LIVE_URL: https://cloudsentinel.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping /health (cold start tolerated)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$LIVE_URL/health" || echo 000)
          echo "GET /health -> $code"
          # 200 = awake; anything else is reported but never fails the
          # schedule (the deploy may simply not exist yet)
          if [ "$code" != "200" ]; then echo "::warning::live /health returned $code"; fi
