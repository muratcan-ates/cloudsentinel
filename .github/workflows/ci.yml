# CloudSentinel CI — every push and pull request must arrive suite-green.
# The fake LLM provider keeps the run deterministic and quota-free, exactly
# like the local `make test` path.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Neither job writes anything back: checkout is all they need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test suite
        run: pytest -q
        env:
          SENTINEL_FAKE_LLM: "1"

  # A security product that never scans itself is asking for trust it has
  # not earned. Same commands as `make audit`, run on every push and PR:
  # bandit over our own source, pip-audit over what we actually depend on.
  # Its own job so a supply-chain regression reads as a security failure
  # rather than a test failure.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # bandit.yaml carries the four skipped checks, each with a written
      # reason. Anything not named there fails this job.
      - name: Static analysis (bandit)
        run: bandit -c bandit.yaml -r app main.py scripts -q
      # The list that ships to Render — a vulnerability here is a
      # vulnerability in the deployed product.
      - name: Dependency audit — runtime (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
      # The toolchain a jury installs with `make setup`.
      - name: Dependency audit — dev (pip-audit)
        run: pip-audit -r requirements-dev.txt --progress-spinner off
